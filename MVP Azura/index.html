<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2026-08-06-1.2">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>English Trainer</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>
<div style="position:fixed; top:0; left:0; background:red; color:white; z-index:9999; font-size:12px;">
    VERSION 1.3
</div>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading your words...</div>
    </div>
    <button id="reset-session" style="position:fixed; top:10px; right:10px; z-index:999;">
        Reset Session (dev)
    </button>

    <div id="app" style="display: none;">
        <!-- all your app content here -->
        <div id="top-row">
            <button id="options-btn">Options</button>

            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>

            <div id="progress-counter"></div>
        </div>


        <div id="card">
            <div id="sentence"></div>

            <div id="translation-row">
                <div id="translation"></div>
                <div id="level-indicator"></div>
            </div>
        </div>
        <div id="helper"></div>
    </div>

    <div id="options-modal" style="display:none;">
        <div class="options-card">

            <h3 class="options-title">Settings</h3>

            <div class="setting-row">
                <label for="session-select">Words per session</label>
                <select id="session-select">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                </select>
            </div>

            <div class="setting-row">
                <label for="sound-toggle">Sound</label>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle">
                    <span class="slider"></span>
                </label>
            </div>


            <div id="settings-message"></div>
            <button id="save-options">Save</button>

        </div>
    </div>

<!-- <script type="module" src="./js/app.js"></script> -->

<script>
    const version = document.querySelector('meta[name="app-version"]').content;

    // CSS
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `./style.css?v=${version}`;
    document.head.appendChild(link);

    // JS
    const script = document.createElement('script');
    script.type = 'module';
    script.src = `./js/app.js?v=2026-08-06-1.3`;
    // script.src = `./js/app.js?v=${version}`;
    document.body.appendChild(script);
</script>

</body>
</html>
