    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading your words...</div>
    </div>

 

    <div id="app" style="display: none;">
        
        <header id="option-row">

            <div class="stats-row">
                
                    <div class="counter-box">
                        <span class="icon-wrapper">
                            <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                        </span>
                        <div id="total-completed-counter"></div>
                    </div>
                    <div id="level-indicator"></div>

            </div>

            <div class="toggle-row">
                <div class="toggle-box">
                    <label for="theme-toggle">
                        <!-- Theme SVG Wrapper for Animation -->
                        <span class="icon-wrapper theme-icon-wrap">
                            <!-- Sun Icon (Light Mode) -->
                            <svg class="shape-sun"><use href="assets/icons/sprite.svg#icon-sun"></use></svg>
                            <!-- Moon Icon (Dark Mode) -->
                            <svg class="shape-moon"><use href="assets/icons/sprite.svg#icon-moon"></use></svg>
                        </span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark theme">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-box">
                    <label for="sound-toggle">
                        <!-- Sound SVG Wrapper for Animation -->
                        <span class="icon-wrapper sound-icon-wrap">
                            <svg class="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                                <!-- Regular sound waves -->
                                <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                <!-- Mute diagonal line (hidden by default) -->
                                <g class="mute-lines">
                                    <line x1="22" y1="9" x2="16" y2="15"></line>
                                    <line x1="16" y1="9" x2="22" y2="15"></line>
                                </g>
                            </svg>
                        </span>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>   

                        




            <!-- <button id="options-btn">Options</button> -->

        </header>   

        <div id="progress-row">

            <div id="progress-bar"></div>

            <div id="progress-counter"></div>
        </div>

        <main id="container">



            <div id="content">

                <div id="card">
            
                    <div id="session-state" class="session-state fade-hidden"></div>

                    <div id="sentence-area">
                        <div id="sentence"></div>

                        <div id="translation-row">
                            <div id="translation-group">
                                <div id="translation"></div>
                                <div id="part-of-speech"></div>
                            </div>
                        </div>
                        
                    </div>
                </div>

            </div>

        </main>
        
        <div id="helper"></div>

    </div>
