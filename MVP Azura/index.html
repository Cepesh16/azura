<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2026-08-06-1.3">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>English Trainer</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading your words...</div>
    </div>

    <div id="app" style="display: none;">

        <!-- all your app content here -->
        <div class="option-row">
            <button id="options-btn">Options</button>
        </div>

        <div id="counter-row">
            <div id="total-completed-counter"></div>
        </div>

        <div id="progress-row">

            <div id="progress-bar"></div>

            <div id="progress-counter"></div>
        </div>



        <div id="card">
    
            <div id="session-state" class="session-state fade-hidden"></div>

            <div id="sentence-area">
                <div id="sentence"></div>

                <div id="translation-row">
                    <div id="translation-group">
                        <div id="translation"></div>
                        <div id="part-of-speech"></div>
                    </div>
                </div>
                <div id="level-indicator"></div>
            </div>
        </div>

        <div id="helper"></div>
    </div>

    <div id="options-modal" style="display:none;">
        <div class="options-card">

            <h3 class="options-title">Settings</h3>

            <div class="setting-row">
                <label for="theme-toggle">Dark mode</label>
                <label class="switch">
                    <input type="checkbox" id="theme-toggle" aria-label="Toggle dark theme">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <label for="sound-toggle">Sound</label>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle">
                    <span class="slider"></span>
                </label>
            </div>
<!-- 
            <div class="setting-row">
                <label for="session-select">Words per session</label>
                <select id="session-select">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="15">15</option>
                </select>
            </div>
 -->


            <div id="settings-message"></div>
            <button id="save-options">Save</button>

        </div>
    </div>


<!-- <script type="module" src="./js/app.js"></script> -->
<link rel="stylesheet" href="./style.css?v=1.3">

<script type="module" src="./js/app.js?v=1.3"></script>


</body>
</html>
