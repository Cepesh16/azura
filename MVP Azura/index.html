<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2026-08-06-1.3111">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<!-- to apply theme to preloader -->
<script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    }
</script>
    <link rel="preload" href="assets/fonts/Raleway-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="./style.css?v=1.0">
    <title>English Trainer</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>



<!-- SCREENS -->
    <div id="screen-container">

        <div id="profile-screen" class="screen active">
            
            <header class="screen-header">
                <div class="header-option">
                            <label class="switch">
                                <!-- Theme SVG Wrapper for Animation -->
                                <span class="sun">
                                    <!-- Sun Icon (Light Mode) -->
                                    <svg class="shape-sun"><use href="assets/icons/sprite.svg#icon-sun"></use></svg>
                                </span>
                                <span class="moon">
                                    <!-- Moon Icon (Dark Mode) -->
                                    <svg class="shape-moon"><use href="assets/icons/sprite.svg#icon-moon"></use></svg>
                                </span>
                                <input id="theme-toggle" type="checkbox">
                                <span class="slider"></span>
                            </label>
                </div>

            </header>
          
            <h1 class="screen-title">Tomo English</h1>

            <svg class="profile-image" role="img" aria-label="visual progress">
                <use href="assets/images/sprite-images.svg#cat"></use>
            </svg>



            <div class="profile-nav">
                <button id="profile-start" class="profile-button">Start</button>

                <div class="button-row">
                    <button id="profile-status" class="profile-button">Status</button>
                    <button id="profile-progress" class="profile-button">Progress</button>
                </div>
            </div>


        </div>

        <div id="trainer-screen" class="screen">

            <div id="loading">
                <div class="spinner"></div>
                <div id="loading-text">Loading your words...</div>
            </div>

         

            <div id="app" style="display: none;">

                <div class="header-trainer">

                    <div id="option-row">

                        <div class="stats-row">
                            
                                <div class="counter-box">
                                    <span class="icon-wrapper">
                                        <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                                    </span>
                                    <div id="total-completed-counter"></div>
                                </div>
                                

                        </div>

                        <div class="toggle-row">

                            <div class="toggle-box">
                                <label class="toggleSwitch icon-wrapper" for="sound-toggle">
                                    <input id="sound-toggle" type="checkbox">
                                    <span class="icon-wrapper speaker">
                                        <!-- Sound SVG Wrapper for Animation -->
                                            <svg class="icon-sound-waves"><use href="assets/icons/sprite.svg?v=121#icon-sound-waves"></use></svg>
                                    </span>
                                    <span class="icon-wrapper mute-speaker">
                                            <svg class="icon-sound-mute"><use href="assets/icons/sprite.svg#icon-sound-mute"></use></svg>
                                    </span>
                                </label>
                            </div>

                            <!-- Back button-->
                            <div class="back-button">
                                <span class="icon-wrapper">
                                    <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-exit-rounded"></use></svg>
                                </span>
                            </div>
                            
                        </div>   


                    </div>  

                    <div id="progress-row">

                        <div id="progress-bar"></div>

                        <div id="progress-counter"></div>
                    </div> 
                    
                </div>


                



                
                <main id="container">



                    <div id="content">

                        <div id="card">
                    
                            <div id="session-state" class="session-state fade-hidden"></div>

                            <div id="sentence-area">
                                <div id="level-indicator"></div>  
                                <div id="sentence"></div>

                                <div id="helper"></div>
                            </div>
                        </div>

                    </div>

                </main>


                <div id="translation-row">

                    <div id="translation-box">
                        <span id="explanation-toggle">+</span>
                        <div id="translation"></div>
                        <!-- <div id="part-of-speech"></div> -->
                    </div>

                    <div id="explanation"></div>

                </div>

            </div>

        </div>

        <div id="status-screen" class="screen">


            <header class="screen-header">
                <div class="header-option">

                    <!-- Back button-->
                    <div class="back-button">
                        <span class="icon-wrapper">
                            <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-exit-rounded"></use></svg>
                        </span>
                    </div>
                </div>

            </header>

            <h1 class="screen-title">Status</h1>

            <ul class="status-panel">
                 <li class="status-row left-group">
                    <span class="status-icon icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                    </span>
                    <span class="status-name">age</span>
                    <span class="status-value">newborn</span>
                </li>                            

            
                <li class="status-row">
                    <span class="status-icon icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-book"></use></svg>
                    </span>
                    <span class="status-name">education</span>
                    <span class="status-value">home</span>
                </li>

                <li class="status-row right-group">
                    <span class="status-icon icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-star"></use></svg>
                    </span>
                    <span class="status-name">income</span>
                    <span class="status-value">dependent</span>
                </li>


            </ul>


        </div>

        <div id="progress-screen" class="screen">
           

            <header class="screen-header">
                <div class="header-option">

                    <!-- Back button-->
                    <div class="back-button">
                        <span class="icon-wrapper">
                            <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-exit-rounded"></use></svg>
                        </span>
                    </div>
                </div>

            </header>

            <h1 class="screen-title">Progress</h1>

            <ul class="progress-panel">
                 <li class="progress-panel--row">
                    <span class="icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-target"></use></svg>
                    </span>
                    <span class="progress-name">midway</span>
                    <div id="medium-level-counter" class="progress-value"></div>
                </li>                            
                
                <li class="progress-panel--row">
                    <span class="icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-completed"></use></svg>
                    </span>
                    <span class="progress-name">learned</span>
                    <div id="learned-counter" class="progress-value"></div>
                </li>
            
                <li class="progress-panel--row">
                    <span class="icon-wrapper">
                        <svg><use href="assets/icons/sprite.svg#icon-streak"></use></svg>
                    </span>
                    <span class="progress-name">retained</span>
                    <div id="retained-counter" class="progress-value"></div>
                </li>
            </ul>


            <button id="progress-words" class="profile-button">
                My words
            </button>


        </div>

            <div id="progress-words-screen" class="screen">

                <header class="screen-header">
                    <div class="header-option">
                        <div class="back-button">
                            <span class="icon-wrapper">
                                <svg class="icon-exit">
                                    <use href="assets/icons/sprite.svg?v=12111#icon-exit-rounded"></use>
                                </svg>
                            </span>
                        </div>
                    </div>
                </header>

                <h1 class="screen-title">My words</h1>

                <div class="words-controls">
                    <input id="words-search"
                        type="search"
                        placeholder="Search words..."
                        autocomplete="off"
                    >

                    <select id="words-level-filter">
                        <option value="all">All</option>
                        <option value="0">New</option>
                        <option value="1">*</option>
                        <option value="2">**</option>
                        <option value="3">***</option>
                        <option value="4">****</option>
                        <option value="5">Learned</option>
                    </select>
                </div>

                <div id="words-count" class="words-count" aria-live="polite">
                    Words: 0
                </div>

                <div id="words-list" class="words-list"></div>

            </div>


        <!-- future screens can be added here -->

    </div>


    <footer id="footer">
        <div class="version">build 53 stable </div>
    </footer>



<!-- <script type="module" src="./js/app.js"></script> -->
<script type="module" src="./js/app.js?v=1.0"></script>


</body>
</html>
