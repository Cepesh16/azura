<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2026-08-06-1.3">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>English Trainer</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>

    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading your words...</div>
    </div>

    <div id="app" style="display: none;">

        <!-- all your app content here -->
        <div class="option-row">
            <div id="total-completed-counter"></div>
            <!-- <button id="options-btn">Options</button> -->
            <div class="toggle-row">
                <div class="toggle-box">
                    <label for="theme-toggle">
                        <!-- Theme SVG Container -->
                        <svg class="icon-theme" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <!-- Moon Shape -->
                            <path class="shape-moon" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                            <!-- Sun Shape -->
                            <g class="shape-sun">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
                            </g>
                        </svg>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="theme-toggle" aria-label="Toggle dark theme">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="toggle-box">
                    <label for="sound-toggle">
                        <!-- Sound SVG Icon -->
                        <svg class="icon-sound" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M11 5 6 9H2v6h4l5 4V5Z"/>
                            <!-- Regular sound waves -->
                            <path class="sound-wave" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
                            <!-- Mute diagonal line (hidden by default) -->
                            <line class="mute-line" x1="22" y1="2" x2="2" y2="22" stroke="currentColor" style="display: none;" />
                        </svg>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="sound-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>


        <div id="progress-row">

            <div id="progress-bar"></div>

            <div id="progress-counter"></div>
        </div>



        <div id="card">
    
            <div id="session-state" class="session-state fade-hidden"></div>

            <div id="sentence-area">
                <div id="sentence"></div>

                <div id="translation-row">
                    <div id="translation-group">
                        <div id="translation"></div>
                        <div id="part-of-speech"></div>
                    </div>
                </div>
                <div id="level-indicator"></div>
            </div>
        </div>

        <div id="helper"></div>
    </div>
