<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="app-version" content="2026-08-06-1.3111">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<!-- to apply theme to preloader -->
<script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
    }
</script>
    <link rel="preload" href="assets/fonts/Raleway-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="icon" type="image/png" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="./style.css?v=1.0">
    <title>English Trainer</title>
    <!-- <link rel="stylesheet" href="styles.css"> -->
</head>
<body>



<!-- SCREENS -->
    <div id="screen-container">

        <div id="profile-screen" class="screen active">
            
            <header class="screen-header">
                <div class="header-option">
                            <label class="switch">
                                <!-- Theme SVG Wrapper for Animation -->
                                <span class="sun">
                                    <!-- Sun Icon (Light Mode) -->
                                    <svg class="shape-sun"><use href="assets/icons/sprite.svg#icon-sun"></use></svg>
                                </span>
                                <span class="moon">
                                    <!-- Moon Icon (Dark Mode) -->
                                    <svg class="shape-moon"><use href="assets/icons/sprite.svg#icon-moon"></use></svg>
                                </span>
                                <input id="theme-toggle" type="checkbox">
                                <span class="slider"></span>
                            </label>
                </div>

            </header>
          
            <h1 class="screen-title">Tomo English</h1>

            <svg class="profile-image" role="img" aria-label="visual progress">
                <use href="assets/images/sprite-images.svg#cat"></use>
            </svg>



            <div class="profile-nav">

                <div class="btn-row">
                    <button id="profile-start" class="btn-profile">
                    <!-- <span class="icon-wrap-btn pos-left">
                            <svg><use href="assets/icons/sprite.svg#icon-start"></use></svg>
                        </span> -->
                        Learn
                    </button>
                    </div>
                <div class="btn-row">

                    <button id="profile-status" class="btn-profile">
                        <span class="icon-wrap-btn">
                            <svg><use href="assets/icons/sprite.svg#icon-user"></use></svg>
                        </span>
                    </button>

                    <button id="profile-progress" class="btn-profile">
                        <span class="icon-wrap-btn">
                            <svg><use href="assets/icons/sprite.svg#icon-stats-line"></use></svg>
                        </span>
                    </button>

                    <button id="profile-setting" class="btn-profile">
                        <span class="icon-wrap-btn">
                            <svg><use href="assets/icons/sprite.svg#icon-settings-dual-gear"></use></svg>
                        </span>
                    </button>
                </div>

            </div>


        </div>

        <div id="screen-trainer" class="screen">

            <div id="loading">
                <div class="spinner"></div>
                <div id="loading-text">Loading your words...</div>
            </div>

         

            <div id="app" style="display: none;">

                <div class="header-trainer">

                    <div id="option-row">

                        <div class="stats-row">
                            
                                <div class="counter-box">
                                    <span class="icon-wrap">
                                        <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                                    </span>
                                    <div class="id-counter-words-all">0</div>
                                </div>   

                                <div class="counter-box">
                                    <span class="icon-wrap">
                                        <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                                    </span>
                                    <div class="id-counter-words-unique">0</div>
                                </div>
                                

                        </div>

                        <div class="toggle-row">

                            <div class="toggle-box">
                                <label class="toggleSwitch icon-wrap-opt" for="sound-toggle">
                                    <input id="sound-toggle" type="checkbox">
                                    <span class="speaker flex">
                                        <!-- Sound SVG Wrapper for Animation -->
                                            <svg class="icon-sound-waves"><use href="assets/icons/sprite.svg?v=121#icon-sound-waves"></use></svg>
                                    </span>
                                    <span class="mute-speaker flex">
                                            <svg class="icon-sound-mute"><use href="assets/icons/sprite.svg#icon-sound-mute"></use></svg>
                                    </span>
                                </label>
                            </div>

                            <!-- Back button-->
                            <button class="id-back-button btn-back icon-wrap-opt">
                                <span class="flex">
                                    <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-back-chevron"></use></svg>
                                </span>
                            </button>
                            
                        </div>   


                    </div>  

                    <div id="progress-row">

                        <div id="progress-bar"></div>

                        <div id="id-counter-progress-bar"></div>
                    </div> 
                    
                </div>


                



                
                <main id="container">



                    <div id="content">

                        <div id="card">
                    
                            <div id="session-state" class="session-state fade-hidden"></div>

                            <div id="sentence-area">
                                <div id="level-indicator"></div>  
                                <div id="sentence"></div>

                                <div id="helper"></div>
                            </div>
                        </div>

                    </div>

                </main>


                <div id="translation-row">

                    <div id="translation-box">
                        <span id="explanation-toggle">+</span>
                        <button id="translation"></button>
                        <!-- <div id="part-of-speech"></div> -->
                    </div>

                    <div id="explanation"></div>

                </div>

            </div>

        </div>

        <div id="screen-status" class="screen">


            <header class="screen-header">
                <div class="header-option">

                    <!-- Back button-->
                    <button class="id-back-button btn-back icon-wrap-opt">
                        <span class="flex">
                            <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-back-chevron"></use></svg>
                        </span>
                    </button>
                </div>

            </header>

            <h1 class="screen-title">Status</h1>


            <h2 class="screen-subtitle">Current status</h2>
            <ul class="status-panel">
  
                 <li class="status-row">
                    <span class="status-icon icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-cake"></use></svg>
                    </span>
                    <span class="status-name">age:</span>
                    <span class="status-value">newborn</span>
                </li>                            

                <li class="status-row">
                    <span class="status-icon icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-graduation-cap"></use></svg>
                    </span>
                    <span class="status-name">education:</span>
                    <span class="status-value">home</span>
                </li>

                <li class="status-row">
                    <span class="status-icon icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-money-bill"></use></svg>
                    </span>
                    <span class="status-name">income:</span>
                    <span class="status-value">dependent</span>
                </li>

            </ul>


            <button class="id-back-button btn-profile">
                <span class="icon-wrap-btn pos-left">
                    <svg><use href="assets/icons/sprite.svg#icon-back-chevron"></use></svg>
                </span>Back
            </button>


        </div>

        <div id="screen-progress" class="screen">
           

            <header class="screen-header">
                <div class="header-option">

                    <!-- Back button-->
                    <button class="id-back-button btn-back icon-wrap-opt">
                        <span class="flex">
                            <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-back-chevron"></use></svg>
                        </span>
                    </button>
                </div>

            </header>

            <h1 class="screen-title">Progress</h1>



            <h2 class="screen-subtitle">Number of words</h2>
            <ul class="progress-panel">
                 <li class="progress-panel--row">
                    <span class="icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-words-deck"></use></svg>
                    </span>
                    <span class="progress-name">total shown</span>
                    <span class="id-counter-words-all progress-value">0</span>
                </li>                    

                <li class="progress-panel--row">
                    <span class="icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-star"></use></svg>
                    </span>
                    <span class="progress-name">unique shown</span>
                    <span class="id-counter-words-unique progress-value">0</span>
                </li>                   

                <li class="progress-panel--row">
                    <span class="icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-half-glass"></use></svg>
                    </span>
                    <span class="progress-name">midway</span>
                    <span class="id-counter-words-midway progress-value">0</span>
                </li> 
                
                <li class="progress-panel--row">
                    <span class="icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-completed"></use></svg>
                    </span>
                    <span class="progress-name">learned</span>
                    <span class="id-counter-words-learned progress-value">0</span>
                </li>
            
                <li class="progress-panel--row">
                    <span class="icon-wrap">
                        <svg><use href="assets/icons/sprite.svg#icon-streak"></use></svg>
                    </span>
                    <span class="progress-name">retained</span>
                    <span class="id-counter-words-retained progress-value">0</span>
                </li>
            </ul>

            <button id="progress-words" class="btn-profile">
                <span class="icon-wrap-btn pos-left">
                    <svg><use href="assets/icons/sprite.svg#icon-words-list-az"></use></svg>
                </span>
                My words
            </button>

            <button class="id-back-button btn-profile">
                <span class="icon-wrap-btn pos-left">
                    <svg><use href="assets/icons/sprite.svg#icon-back-chevron"></use></svg>
                </span>Back
            </button>

        </div>


            <div id="screen-vocabulary" class="screen">

                <header class="screen-header">
                    <div class="header-option">
                        <div class="id-back-button btn-back icon-wrap-opt">
                            <span class="flex">
                                <svg class="icon-exit">
                                    <use href="assets/icons/sprite.svg?v=12111#icon-back-chevron"></use>
                                </svg>
                            </span>
                        </div>
                    </div>
                </header>

                <h1 class="screen-title">My words</h1>

                <div class="words-controls">
                    <input id="words-search"
                        type="search"
                        placeholder="Search..."
                        autocomplete="off"
                    >

                    <select id="words-level-filter">
                        <option value="all">All</option>
                        <option value="0">New</option>
                        <option value="1">*</option>
                        <option value="2">**</option>
                        <option value="3">***</option>
                        <option value="4">****</option>
                        <option value="5">Learned</option>
                    </select>
                </div>

                <div id="words-count" class="words-count" aria-live="polite">
                    Words: 0
                </div>

                <div id="words-list" class="words-list"></div>

                <button class="id-back-button btn-profile">
                    <span class="icon-wrap-btn pos-left">
                        <svg><use href="assets/icons/sprite.svg#icon-back-chevron"></use></svg>
                    </span>Back
                </button>

            </div>

        <div id="screen-settings" class="screen">

            <header class="screen-header">
                <div class="header-option">

                    <!-- Back button-->
                    <button class="id-back-button btn-back icon-wrap-opt">
                        <span class="flex">
                            <svg class="icon-exit"><use href="assets/icons/sprite.svg?v=12111#icon-back-chevron"></use></svg>
                        </span>
                    </button>
                </div>

            </header>

            <h1 class="screen-title">Settings</h1>


            <h2 class="screen-subtitle">General</h2>


            <button id="reset-progress" class="btn-profile">
                <span class="icon-wrap-btn pos-left">
                    <svg><use href="assets/icons/sprite.svg#icon-trash"></use></svg>
                </span>
                Reset
            </button>

            <button class="id-back-button btn-profile">
                <span class="icon-wrap-btn pos-left">
                    <svg><use href="assets/icons/sprite.svg#icon-back-chevron"></use></svg>
                </span>Back
            </button>


        </div>




        <!-- future screens can be added here -->

    </div>


    <footer id="footer">
        <div class="version">build 56 stable </div>
    </footer>



<!-- <script type="module" src="./js/app.js"></script> -->
<script type="module" src="./js/app.js?v=1.00"></script>


</body>
</html>
