    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">Loading your words...</div>
    </div>

 

    <div id="app" style="display: none;">
        
        <header id="option-row">

            <div class="stats-row">
                
                    <div class="counter-box">
                        <span class="icon-wrapper">
                            <svg><use href="assets/icons/sprite.svg#icon-stats"></use></svg>
                        </span>
                        <div id="total-completed-counter"></div>
                    </div>
                    

            </div>

            <div class="toggle-row">


                <label class="switch">
                    <!-- Theme SVG Wrapper for Animation -->
                    <span class="sun">
                        <!-- Sun Icon (Light Mode) -->
                        <svg class="shape-sun"><use href="assets/icons/sprite.svg#icon-sun"></use></svg>
                    </span>
                    <span class="moon">
                        <!-- Moon Icon (Dark Mode) -->
                        <svg class="shape-moon"><use href="assets/icons/sprite.svg#icon-moon"></use></svg>
                    </span>
                    <input id="theme-toggle" type="checkbox">
                    <span class="slider"></span>
                </label>
                

                <div class="toggle-box">
                    <label class="toggleSwitch icon-wrapper" for="sound-toggle">
                        <input id="sound-toggle" type="checkbox">
                        <span class="icon-wrapper speaker">
                            <!-- Sound SVG Wrapper for Animation -->
                                <svg class="icon-sound-waves"><use href="assets/icons/sprite.svg#icon-sound-waves"></use></svg>
                        </span>
                        <span class="icon-wrapper mute-speaker">
                                <svg class="icon-sound-mute"><use href="assets/icons/sprite.svg#icon-sound-mute"></use></svg>
                        </span>
                    </label>
                </div>
                
            </div>   

                        


        </header>   



<!--         <div id="progress-row">

            <div id="progress-bar"></div>

            <div id="progress-counter"></div>

                        <div id="translation-row">
                            <div id="translation-box">
                                <div id="translation"></div>
                                <div id="level-indicator"></div>                        
                                <!-- <div id="part-of-speech"></div> -->
                            </div>
                        </div>
        <main id="container">



            <div id="content">

                <div id="card">
            
                    <div id="session-state" class="session-state fade-hidden"></div>

                    <div id="sentence-area">
                        
                        <div id="sentence"></div>
        <div id="helper"></div>
                        
                    </div>
                </div>

            </div>

        </main>




    </div>
